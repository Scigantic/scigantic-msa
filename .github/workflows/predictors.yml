name: Predictor loaders

# Loads our output files with Boltz's and Chai-1's own parsers. Heavy (torch),
# so it runs weekly and on demand, not on every push.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  predictors:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install scigantic-msa
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Boltz and Chai-1 in their own environments
        run: |
          uv venv /tmp/vboltz -p 3.12
          uv pip install -p /tmp/vboltz/bin/python boltz --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          uv venv /tmp/vchai -p 3.12
          uv pip install -p /tmp/vchai/bin/python chai_lab "pyarrow<20" --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Test
        env:
          SCIGANTIC_MSA_TEST_BOLTZ_PYTHON: /tmp/vboltz/bin/python
          SCIGANTIC_MSA_TEST_CHAI_PYTHON: /tmp/vchai/bin/python
        run: pytest -q -rs tests/test_predictors.py
